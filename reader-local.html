<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Reader — Local Voice</title>
<style>
  :root {
    --ink: #14181d; --paper: #ffffff; --muted: #5a6472; --line: #d8dde4;
    --accent: #0f5f5c; --sentence: #dff0ef;
  }
  [data-theme="cream"] {
    --ink: #2c2620; --paper: #f7f1e4; --line: #ded3bd; --sentence: #e6ddc7;
  }
  [data-theme="dark"] {
    --ink: #e9edf2; --paper: #14181d; --muted: #9aa5b3; --line: #2c343e;
    --accent: #5fd3ce; --sentence: #1e2b32;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    flex: none; border-bottom: 1px solid var(--line); padding: .6rem 1rem;
    display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; align-items: center;
  }
  .brand { font-weight: 700; }
  .grp { display: flex; align-items: center; gap: .4rem; font-size: .82rem; color: var(--muted); }
  .grp label { white-space: nowrap; }
  select, input[type=range] { accent-color: var(--accent); }
  select {
    font: inherit; font-size: .85rem; padding: .3rem .4rem; max-width: 16rem;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px;
  }
  input[type=range] { width: 7rem; }
  .val { font-variant-numeric: tabular-nums; min-width: 2.6rem; }
  button {
    font: inherit; font-size: .85rem; padding: .4rem .8rem;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 5px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.go { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  [data-theme="dark"] button.go { color: #06201f; }

  #bar {
    flex: none; height: 3px; background: var(--line);
  }
  #barFill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  main {
    flex: 1; overflow-y: auto; display: flex; justify-content: center;
    padding: 2rem 1.5rem 5rem;
  }
  .pane { width: 100%; max-width: 60rem; }
  textarea {
    width: 100%; min-height: 55vh;
    font-family: Georgia, serif; font-size: 1.05rem; line-height: 1.6;
    padding: 1.2rem; background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; resize: vertical;
  }
  .hint { color: var(--muted); font-size: .85rem; margin: .8rem 0 0; }
  #read { font-family: Georgia, serif; font-size: 34px; line-height: 1.65; }
  #read p { margin: 0 0 1em; }
  .s { border-radius: 4px; padding: .06em 0; transition: background-color .12s; }
  .s.on { background: var(--sentence); }
  .s.pending { opacity: .45; }
  footer {
    flex: none; border-top: 1px solid var(--line); padding: .45rem 1rem;
    font-size: .8rem; color: var(--muted);
    display: flex; justify-content: space-between; gap: 1rem;
  }
  .warn { color: #b3261e; }
  [data-theme="dark"] .warn { color: #ffb4ab; }
  .hidden { display: none !important; }
  #banner {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: .7rem;
    padding: .7rem 1rem; background: #fdf2d6; color: #4a3a05;
    border-bottom: 1px solid #e6cf8e; font-size: .88rem;
  }
  [data-theme="dark"] #banner { background: #3a3108; color: #f4e6b8; border-bottom-color: #5c4d16; }
  #banner button { background: #4a3a05; border-color: #4a3a05; color: #fdf2d6; font-weight: 600; }
  #banner button.ghost { background: transparent; border-color: currentColor; color: inherit; font-weight: 400; }
  @media (prefers-reduced-motion: reduce) { .s { transition: none; } }
</style>
</head>
<body data-theme="light">

<header>
  <span class="brand">Class Reader</span>

  <div class="grp">
    <label for="engine">Reader</label>
    <select id="engine">
      <option value="local">Natural voice</option>
      <option value="quick">Quick voice</option>
    </select>
  </div>

  <div class="grp">
    <label for="voice">Voice</label>
    <select id="voice" disabled></select>
    <button id="allVoices" title="Show every voice">All</button>
  </div>

  <div class="grp">
    <label for="rate">Speed</label>
    <input type="range" id="rate" min="0.6" max="1.4" step="0.05" value="1">
    <span class="val" id="rateVal">1.0x</span>
  </div>

  <div class="grp">
    <label for="size">Size</label>
    <input type="range" id="size" min="18" max="80" step="2" value="34">
    <span class="val" id="sizeVal">34</span>
  </div>

  <div class="grp"><button id="theme">Theme</button><button id="clear" title="Delete all audio saved on this computer">Clear saved</button></div>

  <div class="grp" style="margin-left:auto">
    <button id="edit" class="hidden">Edit text</button>
    <button id="prepare" class="go" disabled>Prepare audio</button>
    <button id="play" class="go hidden">Play</button>
    <button id="pause" class="hidden">Pause</button>
    <button id="stop" class="hidden">Stop</button>
  </div>
</header>

<div id="banner" class="hidden">
  <span id="bannerText"></span>
  <button id="switchQuick">Use the Quick voice</button>
  <button id="keepWaiting" class="ghost">Keep waiting</button>
</div>

<div id="bar"><div id="barFill"></div></div>

<main>
  <div class="pane" id="editPane">
    <textarea id="input" placeholder="Paste a passage or short story here, then choose Prepare audio."></textarea>
    <p class="hint">
      The voice runs on this computer. The first visit downloads it once
      (about 92 MB); after that it works without sending any text anywhere.
      Prepare the audio before class, then Play is instant.
    </p>
  </div>
  <div class="pane hidden" id="readPane"><div id="read"></div></div>
</main>

<footer>
  <span id="status">Loading voice engine…</span>
  <span id="note"></span>
</footer>

<audio id="player"></audio>

<script type="module">
import { KokoroTTS } from "https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.web.js";

const $ = (id) => document.getElementById(id);
const player = $('player');

let tts = null;
let sentences = [];   // [{text, el, url}]
let idx = 0;
let playing = false;
let generating = false;
let readyCount = 0;
let engine = 'local';   // 'local' = Kokoro model, 'quick' = browser speech
let slowTimer = null;
let speechGen = 0;      // invalidates stale browser-speech callbacks

// ---------- model ----------
async function boot() {
  fillVoices();
  const device = ('gpu' in navigator) ? 'webgpu' : 'wasm';
  $('note').textContent = device === 'webgpu' ? 'WebGPU' : 'WASM (slower)';

  try {
    tts = await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', {
      dtype: device === 'webgpu' ? 'fp32' : 'q8',
      device,
      progress_callback: (p) => {
        if (p.status === 'progress' && p.total) {
          const pct = Math.round((p.loaded / p.total) * 100);
          $('barFill').style.width = pct + '%';
          $('status').textContent = 'Downloading voice engine — ' + pct + '%';
        }
      }
    });
  } catch (err) {
    $('status').innerHTML = '<span class="warn">Natural voice unavailable (' +
      err.message + '). Switched to the Quick voice.</span>';
    engine = 'quick';
    $('engine').value = 'quick';
    $('prepare').textContent = 'Load text';
    $('prepare').disabled = false;
    fillVoices();
    return;
  }

  $('barFill').style.width = '0';
  fillVoices();
  $('voice').disabled = false;
  if (engine === 'local') {
    $('prepare').disabled = false;
    $('status').textContent = 'Ready';
  }
}

// Six voices is what a teacher needs. The rest are behind the All toggle.
// Trimming the list is a usability choice, not a speed one — every voice
// lives inside the same model file.
const PICKS = ['af_heart', 'af_bella', 'af_nicole', 'am_michael', 'am_fenrir', 'am_puck'];
let showAllVoices = false;

function fillVoices() {
  const sel = $('voice');
  sel.textContent = '';

  if (engine === 'quick') {
    const list = (window.speechSynthesis ? speechSynthesis.getVoices() : [])
      .filter(v => /^en/i.test(v.lang));
    list.sort((a, b) => (/en-US/i.test(b.lang) ? 0 : 1) - (/en-US/i.test(a.lang) ? 0 : 1));
    list.forEach(v => {
      const o = document.createElement('option');
      o.value = v.name;
      o.textContent = v.name.replace(/^Microsoft\s+/, '').replace(/\s*-\s*English.*$/, '');
      sel.appendChild(o);
    });
    const best = list.find(v => /Google US English/i.test(v.name));
    if (best) { sel.value = best.name; }
    $('allVoices').classList.add('hidden');
    sel.disabled = false;
    return;
  }

  $('allVoices').classList.remove('hidden');
  const all = tts ? (tts.voices || {}) : {};
  const ids = showAllVoices
    ? Object.keys(all)
    : PICKS.filter(id => all[id]);
  const use = ids.length ? ids : Object.keys(all);

  const groups = { Female: [], Male: [], Other: [] };
  use.forEach(id => {
    const v = all[id] || {};
    const g = /female/i.test(v.gender || '') ? 'Female'
            : /male/i.test(v.gender || '') ? 'Male' : 'Other';
    groups[g].push([id, v.name || id]);
  });

  Object.keys(groups).forEach(g => {
    if (!groups[g].length) { return; }
    const og = document.createElement('optgroup');
    og.label = g;
    groups[g].forEach(([id, name]) => {
      const o = document.createElement('option');
      o.value = id;
      o.textContent = name;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  if (sel.querySelector('option[value="af_heart"]')) { sel.value = 'af_heart'; }
  $('allVoices').textContent = showAllVoices ? 'Fewer' : 'All';
}

// ---------- text ----------
function splitSentences(block) {
  const raw = block.match(/[^.!?]+[.!?]*\s*/g) || [block];
  const out = [];
  raw.forEach(s => {
    if (!s.trim()) { return; }
    if (s.length > 320) {
      const parts = s.match(/[^,]+,?\s*/g) || [s];
      let buf = '';
      parts.forEach(p => {
        if ((buf + p).length > 320 && buf) { out.push(buf); buf = p; }
        else { buf += p; }
      });
      if (buf.trim()) { out.push(buf); }
    } else { out.push(s); }
  });
  return out;
}

function build(text) {
  const read = $('read');
  read.textContent = '';
  sentences = [];
  text.split(/\n\s*\n/).forEach(block => {
    if (!block.trim()) { return; }
    const p = document.createElement('p');
    splitSentences(block.replace(/\s*\n\s*/g, ' ')).forEach(s => {
      const span = document.createElement('span');
      span.className = 's pending';
      span.textContent = s;
      p.appendChild(span);
      sentences.push({ text: s.trim(), el: span, url: null });
    });
    read.appendChild(p);
  });
}

function mark(i) {
  sentences.forEach(s => s.el.classList.remove('on'));
  const s = sentences[i];
  if (!s) { return; }
  s.el.classList.add('on');
  s.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function finish() {
  playing = false;
  sentences.forEach(s => s.el.classList.remove('on'));
  idx = 0;
  showButtons({ play: true, pause: false, stop: false });
  $('status').textContent = 'Finished';
}

function showButtons(st) {
  $('play').classList.toggle('hidden', !st.play);
  $('pause').classList.toggle('hidden', !st.pause);
  $('stop').classList.toggle('hidden', !st.stop);
}

// ================= NATURAL VOICE (local model) =================
async function prepareLocal() {
  const voice = $('voice').value;
  const t0 = Date.now();
  generating = true;
  readyCount = 0;
  let fromCache = 0, generated = 0;

  // Give the machine a real chance before suggesting anything. Only if the
  // Play button is still unavailable after 45s do we raise the fallback.
  slowTimer = setTimeout(() => {
    if (generating && $('play').disabled) {
      $('bannerText').innerHTML =
        '<strong>Still preparing.</strong> This computer may be slow with the Natural voice.';
      $('banner').classList.remove('hidden');
    }
  }, 45000);

  for (let i = 0; i < sentences.length; i++) {
    if (!generating) { return; }
    const key = keyFor(voice, sentences[i].text);
    try {
      let blob = await cacheGet(key);
      if (blob) { fromCache++; }
      else {
        const audio = await tts.generate(sentences[i].text, { voice, speed: 1 });
        blob = toBlob(audio);
        generated++;
        cachePut(key, blob);
      }
      sentences[i].url = URL.createObjectURL(blob);
    } catch (err) {
      $('note').innerHTML = '<span class="warn">A sentence failed to generate.</span>';
    }
    sentences[i].el.classList.remove('pending');
    readyCount = i + 1;
    if (readyCount >= 2) { $('play').disabled = false; }

    const per = generated ? ((Date.now() - t0) / 1000) / generated : 0;
    const left = Math.round(per * (sentences.length - readyCount));
    $('barFill').style.width = Math.round((readyCount / sentences.length) * 100) + '%';
    if (!playing) {
      $('status').textContent = 'Preparing ' + readyCount + ' of ' + sentences.length +
        (fromCache ? ' (' + fromCache + ' saved)' : '') +
        (left > 2 ? ' \u2014 about ' + left + 's left' : '') +
        (readyCount >= 2 ? ' \u2014 you can start now' : '');
    }
  }

  generating = false;
  clearTimeout(slowTimer);
  $('banner').classList.add('hidden');
  $('barFill').style.width = '0';
  if (!playing) {
    $('status').textContent = fromCache === sentences.length
      ? 'Ready \u2014 loaded from saved audio'
      : 'Ready \u2014 prepared in ' + Math.round((Date.now() - t0) / 1000) + 's';
  }
}

function playLocalFrom(i) {
  if (i >= sentences.length) { finish(); return; }
  idx = i;
  const s = sentences[i];
  if (!s.url) {
    if (!generating) { playLocalFrom(i + 1); return; }
    $('status').textContent = 'Catching up\u2026';
    setTimeout(() => { if (playing) { playLocalFrom(i); } }, 400);
    return;
  }
  mark(i);
  player.src = s.url;
  player.playbackRate = parseFloat($('rate').value);
  player.play();
  $('status').textContent = 'Reading \u2014 sentence ' + (i + 1) + ' of ' + sentences.length;
}

player.onended = () => { if (playing && engine === 'local') { playLocalFrom(idx + 1); } };

// ================= QUICK VOICE (browser speech) =================
// Nothing to prepare. Every remaining sentence is queued at once so the
// engine plays them back to back without a gap between requests.
function playQuickFrom(startIndex) {
  const gen = ++speechGen;
  speechSynthesis.cancel();

  setTimeout(() => {
    if (gen !== speechGen) { return; }
    const name = $('voice').value;
    const voice = speechSynthesis.getVoices().find(v => v.name === name);
    const rate = parseFloat($('rate').value);

    for (let i = startIndex; i < sentences.length; i++) {
      ((si) => {
        const u = new SpeechSynthesisUtterance(sentences[si].text);
        if (voice) { u.voice = voice; u.lang = voice.lang; }
        u.rate = rate;
        u.onstart = () => {
          if (gen !== speechGen) { return; }
          idx = si;
          mark(si);
          $('status').textContent = 'Reading \u2014 sentence ' + (si + 1) + ' of ' + sentences.length;
        };
        u.onend = () => {
          if (gen !== speechGen) { return; }
          if (si === sentences.length - 1) { finish(); }
        };
        u.onerror = (e) => {
          if (gen !== speechGen || e.error === 'interrupted' || e.error === 'canceled') { return; }
          playing = false;
          showButtons({ play: true, pause: false, stop: false });
          $('status').innerHTML = '<span class="warn">Playback error: ' + e.error + '</span>';
        };
        speechSynthesis.speak(u);
      })(i);
    }
  }, 60);
}

// ================= shared controls =================
function startReading() {
  const text = $('input').value.trim();
  if (!text) { $('status').textContent = 'Paste some text first.'; return; }

  build(text);
  $('editPane').classList.add('hidden');
  $('readPane').classList.remove('hidden');
  $('prepare').classList.add('hidden');
  $('edit').classList.remove('hidden');
  $('play').classList.remove('hidden');
  $('engine').disabled = true;

  if (engine === 'quick') {
    sentences.forEach(s => s.el.classList.remove('pending'));
    $('play').disabled = false;
    $('status').textContent = sentences.length + ' sentences ready';
  } else {
    $('voice').disabled = true;
    $('play').disabled = true;
    prepareLocal();
  }
}

function switchToQuick() {
  generating = false;
  clearTimeout(slowTimer);
  $('banner').classList.add('hidden');
  playing = false;
  player.pause();

  engine = 'quick';
  $('engine').value = 'quick';
  fillVoices();
  sentences.forEach(s => s.el.classList.remove('pending'));
  $('barFill').style.width = '0';
  $('play').disabled = false;
  idx = 0;
  $('status').textContent = 'Switched to the Quick voice \u2014 ready to play';
  $('note').textContent = 'Natural voice was too slow on this computer';
}

$('prepare').onclick = startReading;

$('play').onclick = () => {
  playing = true;
  showButtons({ play: false, pause: true, stop: true });
  if (engine === 'quick') { playQuickFrom(idx); }
  else if (player.src && player.currentTime > 0 && !player.ended) { player.play(); }
  else { playLocalFrom(idx); }
};

$('pause').onclick = () => {
  playing = false;
  if (engine === 'quick') { speechGen++; speechSynthesis.cancel(); }
  else { player.pause(); }
  showButtons({ play: true, pause: false, stop: true });
  $('status').textContent = 'Paused at sentence ' + (idx + 1);
};

$('stop').onclick = () => {
  playing = false;
  if (engine === 'quick') { speechGen++; speechSynthesis.cancel(); }
  else { player.pause(); player.currentTime = 0; }
  finish();
  $('status').textContent = 'Stopped';
};

$('edit').onclick = () => {
  playing = false;
  generating = false;
  readyCount = 0;
  speechGen++;
  clearTimeout(slowTimer);
  if (window.speechSynthesis) { speechSynthesis.cancel(); }
  player.pause();
  sentences.forEach(s => { if (s.url) { URL.revokeObjectURL(s.url); } });
  sentences = [];
  idx = 0;
  $('banner').classList.add('hidden');
  $('readPane').classList.add('hidden');
  $('editPane').classList.remove('hidden');
  $('edit').classList.add('hidden');
  showButtons({ play: false, pause: false, stop: false });
  $('prepare').classList.remove('hidden');
  $('prepare').disabled = false;
  $('engine').disabled = false;
  $('voice').disabled = false;
  $('status').textContent = 'Ready';
};

$('engine').onchange = function () {
  engine = this.value;
  fillVoices();
  $('prepare').textContent = engine === 'quick' ? 'Load text' : 'Prepare audio';
  $('prepare').disabled = (engine === 'local' && !tts);
  $('status').textContent = engine === 'quick'
    ? 'Quick voice \u2014 no wait, plainer sound'
    : (tts ? 'Natural voice \u2014 ready' : 'Natural voice \u2014 still loading');
};

$('switchQuick').onclick = switchToQuick;
$('keepWaiting').onclick = () => { $('banner').classList.add('hidden'); };
$('allVoices').onclick = () => { showAllVoices = !showAllVoices; fillVoices(); };
$('clear').onclick = cacheClear;

$('rate').oninput = function () {
  $('rateVal').textContent = parseFloat(this.value).toFixed(1) + 'x';
  player.playbackRate = parseFloat(this.value);
};
$('size').oninput = function () {
  $('sizeVal').textContent = this.value;
  $('read').style.fontSize = this.value + 'px';
};

const themes = ['light', 'cream', 'dark'];
$('theme').onclick = () => {
  const c = document.body.getAttribute('data-theme');
  document.body.setAttribute('data-theme', themes[(themes.indexOf(c) + 1) % themes.length]);
};

document.addEventListener('keydown', (e) => {
  if (e.code !== 'Space') { return; }
  if (document.activeElement && /TEXTAREA|SELECT|INPUT/.test(document.activeElement.tagName)) { return; }
  e.preventDefault();
  if (playing) { $('pause').click(); }
  else if (!$('play').classList.contains('hidden') && !$('play').disabled) { $('play').click(); }
});

if (window.speechSynthesis) {
  speechSynthesis.addEventListener('voiceschanged', () => { if (engine === 'quick') { fillVoices(); } });
}

boot();
</script>
</body>
</html>
